<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>🏨 SmartHotel Desk</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
body { background:#0f172a; color:#e2e8f0; min-height:100vh; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
.header { position:sticky; top:0; background:linear-gradient(135deg,#1e3a8a,#2563eb); padding:14px; border-radius:0 0 18px 18px; display:flex; justify-content:space-between; align-items:center; margin:0 -16px 16px; z-index:100; }
.header b { font-size:17px; }
.header small { display:block; font-size:11px; opacity:.85; }
.htl-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
.htl-stat { background:#1e293b; border-radius:14px; padding:12px 6px; text-align:center; }
.htl-stat b { font-size:18px; display:block; }
.htl-stat small { font-size:9px; color:#94a3b8; font-weight:700; }
.htl-board { display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:10px; margin-top:10px; }
.htl-modal { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; }
.htl-modal-content { background:#fff; color:#1e293b; border-radius:18px; padding:20px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto; }
.htl-input { width:100%; padding:11px; border:1.5px solid #cbd5e1; border-radius:10px; margin-bottom:8px; font-size:14px; }
.htl-btn { width:100%; padding:13px; border:none; border-radius:11px; font-size:14px; font-weight:700; margin-bottom:7px; cursor:pointer; }
.htl-btn.success { background:#10b981; color:#fff; }
.htl-btn.primary { background:#2563eb; color:#fff; }
.htl-btn.outline { background:#fff; color:#334155; border:1.5px solid #cbd5e1; }
h2 { font-size:17px; margin:12px 0 6px; }
.login { position:fixed; inset:0; background:linear-gradient(135deg,#0f172a,#1e3a8a); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px; }
.login-box { background:#fff; color:#1e293b; border-radius:20px; padding:28px; width:100%; max-width:360px; text-align:center; }
.login-box h1 { font-size:22px; color:#1e3a8a; margin-bottom:4px; }
.login-box p { font-size:12px; color:#64748b; margin-bottom:16px; }
select, input { width:100%; padding:13px; border:1.5px solid #cbd5e1; border-radius:11px; font-size:15px; margin-bottom:10px; }
.login-btn { width:100%; padding:14px; background:#2563eb; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:800; cursor:pointer; }
</style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div class="login" id="loginScreen">
    <div class="login-box">
        <h1>🏨 SmartHotel Desk</h1>
        <p>Reception · Housekeeping · Security</p>

        <div id="ownerSection" style="display:none; text-align:left; background:#eff6ff; border:1px solid #bfdbfe; border-radius:12px; padding:14px; margin-bottom:12px;">
            <b style="font-size:13px; color:#1e3a8a;">🔐 Device Activation</b>
            <p style="font-size:11px; color:#64748b; margin:4px 0 8px;">Owner signs in ONCE — staff PINs after this.</p>
            <input type="email" id="ownerEmail" placeholder="Owner email">
            <input type="password" id="ownerPass" placeholder="Owner password">
            <button class="login-btn" style="background:#10b981;" onclick="htlActivateDevice()">🔓 Activate</button>
        </div>

        <div id="staffSection">
            <select id="staffSelect" style="display:none;" onchange="document.getElementById('pinInput').style.display='block'"></select>
            <input type="password" id="pinInput" placeholder="4-digit PIN" maxlength="4" style="display:none; text-align:center; letter-spacing:8px; font-size:20px;">
            <button class="login-btn" style="display:none;" id="loginBtn" onclick="htlStaffLogin()">🔓 Sign In</button>
            <p onclick="showOwnerActivation()" style="font-size:11px; color:#2563eb; margin-top:12px; cursor:pointer; text-decoration:underline;">New device? Owner activates here</p>
        </div>
    </div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="mainApp" style="display:none;">
    <div class="header">
        <div>
            <b>🏨 <span id="hdTitle">Hotel Desk</span></b>
            <small id="hdWho">—</small>
        </div>
        <button onclick="htlLogout()" style="background:rgba(255,255,255,.2); border:none; color:#fff; padding:8px 14px; border-radius:10px; font-weight:700; cursor:pointer;">🚪</button>
    </div>
    <div id="htlContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
<script src="config.js"></script>

<script>
// ══════════════════════════════════════════════════════════════
//  🏨 SMARTHOTEL DESK — COMPLETE (engine + app in ONE file)
//  Reception board · Cleaner tasks · Guard alerts
// ══════════════════════════════════════════════════════════════

// ─── Supabase (OWN connection — this file is standalone) ───
var htlSb = window.supabase.createClient(SS_CONFIG.SUPABASE_URL, SS_CONFIG.SUPABASE_KEY, { auth: { flowType: 'implicit' } });

// ─── State ───
var HTL = { rooms: [], stays: [], alerts: [], staff: [] };

function htlRole() { return localStorage.getItem('hotelPosition') || null; }
function htlShopId() { return localStorage.getItem('hotelShopId') || localStorage.getItem('shopId') || ''; }
function htlMoney(v) { return 'Br ' + Number(v || 0).toFixed(2); }
function htlEscape(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ═══ AUTH ═══
function showOwnerActivation() {
    document.getElementById('ownerSection').style.display = 'block';
    document.getElementById('staffSection').style.display = 'none';
}

async function htlActivateDevice() {
    var email = document.getElementById('ownerEmail').value.trim();
    var pass = document.getElementById('ownerPass').value;
    if (!email || !pass) { alert('Fill email and password.'); return; }
    try {
        const { error } = await htlSb.auth.signInWithPassword({ email: email, password: pass });
        if (error) throw error;
        // Auto-find the owner's hotel shop
        const { data: myShops } = await htlSb.from('shops').select('shop_id,name,business_type').eq('owner_email', email).eq('active', true);
        var hotel = (myShops || []).find(function(s){ return s.business_type === 'hotel'; });
        var chosen = hotel || (myShops && myShops[0]);
        if (chosen) {
            localStorage.setItem('hotelShopId', chosen.shop_id);
            localStorage.setItem('shopId', chosen.shop_id);
        }
        alert('✅ Device activated for: ' + (chosen ? chosen.name : email));
        location.reload();
    } catch(e) { alert('❌ ' + e.message); }
}

htlSb.auth.onAuthStateChange(async function(event, session) {
    var isReal = session && session.user && session.user.email && !session.user.is_anonymous;
    if (isReal) {
        if (localStorage.getItem('hotelStaffId')) { htlShowMain(); return; }
        await htlShowStaffLogin();
    } else {
        document.getElementById('ownerSection').style.display = 'block';
        document.getElementById('staffSection').style.display = 'none';
    }
});

async function htlShowStaffLogin() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('ownerSection').style.display = 'none';
    document.getElementById('staffSection').style.display = 'block';

    const { data: staff } = await htlSb.from('employees').select('firebase_id, name, position, status')
        .eq('shop_id', htlShopId()).eq('status', 'active')
        .in('position', ['Reception', 'Cleaner', 'Guard']);
    HTL.staff = staff || [];

    var sel = document.getElementById('staffSelect');
    sel.innerHTML = HTL.staff.length
        ? HTL.staff.map(function(s){ return '<option value="' + (s.firebase_id || s.id) + '">' + s.name + ' (' + s.position + ')</option>'; }).join('')
        : '<option value="">No hotel staff found — register them in Admin</option>';
    sel.style.display = 'block';
    document.getElementById('pinInput').style.display = 'block';
    document.getElementById('loginBtn').style.display = 'block';
}

async function htlStaffLogin() {
    var id = document.getElementById('staffSelect').value;
    var pin = document.getElementById('pinInput').value.trim();
    if (!id || !pin) { alert('Select name and enter PIN.'); return; }

    // 🔐 Server-side PIN verification (same security as POS)
    try {
        var token = SS_CONFIG.SUPABASE_KEY;
        var sess = await htlSb.auth.getSession();
        if (sess.data && sess.data.session) token = sess.data.session.access_token;
        var res = await fetch(SS_CONFIG.SUPABASE_URL + '/functions/v1/staff-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'apikey': SS_CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ shop_id: htlShopId(), employee_id: id, pin: String(pin) })
        });
        var v = await res.json();
        if (!v.ok) {
            if (v.reason === 'locked') alert('🔒 Too many attempts. Locked ' + v.minutes + ' min.');
            else if (v.reason === 'network' || v.reason === 'bad_response') alert('📶 Connection problem — check internet.');
            else alert('❌ Wrong PIN!');
            return;
        }
    } catch(e) { alert('📶 Network error: ' + e.message); return; }

    var me = HTL.staff.find(function(s){ return (s.firebase_id || s.id) === id; });
    localStorage.setItem('hotelStaffId', id);
    localStorage.setItem('hotelStaffName', me ? me.name : 'Staff');
    localStorage.setItem('hotelPosition', me ? me.position : '');
    htlShowMain();
}

function htlShowMain() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    var role = htlRole();
    document.getElementById('hdWho').textContent = '👤 ' + (localStorage.getItem('hotelStaffName') || '') + ' · ' + role;
    document.getElementById('hdTitle').textContent = (role === 'Cleaner') ? 'Housekeeping' : (role === 'Guard') ? 'Security' : 'Front Desk';
    htlLoad().then(function(){ htlRenderMyMode(); htlRealtime(); });
}

function htlLogout() {
    localStorage.removeItem('hotelStaffId');
    localStorage.removeItem('hotelPosition');
    location.reload();
}

// ═══ DATA ═══
async function htlLoad() {
    const { data: rooms } = await htlSb.from('rooms').select('*')
        .eq('shop_id', htlShopId()).order('room_number');
    HTL.rooms = rooms || [];

    const { data: stays } = await htlSb.from('guest_stays').select('*')
        .eq('shop_id', htlShopId()).in('status', ['active','reserved'])
        .order('check_in', { ascending: false });
    HTL.stays = stays || [];
}

function htlStayFor(roomId) {
    return HTL.stays.find(function(s){ return s.room_id === roomId && s.status === 'active'; });
}

function htlStats() {
    var total = HTL.rooms.length;
    var occ = HTL.rooms.filter(function(r){ return r.status === 'occupied'; }).length;
    var avail = HTL.rooms.filter(function(r){ return r.status === 'available'; }).length;
    var clean = HTL.rooms.filter(function(r){ return r.status === 'cleaning'; }).length;
    return { total: total, occ: occ, avail: avail, clean: clean, pct: total > 0 ? Math.round(occ/total*100) : 0 };
}

// ═══ RECEPTION ═══
function htlRenderMyMode() {
    var r = htlRole();
    if (r === 'Cleaner') htlRenderCleaner();
    else if (r === 'Guard') htlRenderGuard();
    else htlRenderReception();
}

function htlRenderReception() {
    var s = htlStats();
    document.getElementById('htlContent').innerHTML =
        '<div class="htl-stats">' +
        '<div class="htl-stat"><b>' + s.total + '</b><small>🛏️ TOTAL</small></div>' +
        '<div class="htl-stat" style="background:#065f46;"><b>' + s.avail + '</b><small>✅ FREE</small></div>' +
        '<div class="htl-stat" style="background:#7f1d1d;"><b>' + s.occ + ' (' + s.pct + '%)</b><small>👥 OCCUPIED</small></div>' +
        '<div class="htl-stat" style="background:#92400e;"><b>' + s.clean + '</b><small>🧹 CLEANING</small></div>' +
        '</div>' +
        '<h2 style="margin-top:16px;">🛏️ Room Board <small style="font-size:11px;color:#94a3b8;">(tap a room)</small></h2>' +
        '<div class="htl-board">' + htlBoardHtml() + '</div>';
}

function htlBoardHtml() {
    var colors = { available:'#10b981', occupied:'#ef4444', cleaning:'#f59e0b', maintenance:'#64748b', reserved:'#3b82f6' };
    var html = '';
    HTL.rooms.forEach(function(room) {
        var c = colors[room.status] || '#64748b';
        var stay = htlStayFor(room.id);
        var sub = (room.status === 'occupied' && stay)
            ? stay.guest_name + ' · ' + (stay.planned_checkout ? new Date(stay.planned_checkout).toLocaleDateString() : 'open')
            : (room.room_type + ' · ' + htlMoney(room.base_rate));
        html += '<div onclick="htlOpenRoom(\'' + room.id + '\')" style="background:' + c + ';color:#fff;border-radius:12px;padding:10px;cursor:pointer;min-height:82px;display:flex;flex-direction:column;justify-content:center;">' +
            '<b style="font-size:17px;">' + htlEscape(room.room_number) + '</b>' +
            '<small style="opacity:.92;font-size:10px;line-height:1.35;margin-top:3px;">' + htlEscape(sub) + '</small></div>';
    });
    return html || '<p style="color:#94a3b8;grid-column:1/-1;text-align:center;padding:20px;">No rooms yet — ask the owner to add rooms in Admin.</p>';
}

function htlModal(id, bodyHtml) {
    var old = document.getElementById(id); if (old) old.remove();
    var m = document.createElement('div');
    m.className = 'htl-modal'; m.id = id;
    m.innerHTML = '<div class="htl-modal-content">' + bodyHtml + '</div>';
    m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
    document.body.appendChild(m);
}
function htlCloseModal(id) { var m = document.getElementById(id); if (m) m.remove(); }

function htlOpenRoom(roomId) {
    var room = HTL.rooms.find(function(r){ return r.id === roomId; });
    if (!room) return;
    var stay = htlStayFor(roomId);

    var body = '<h3 style="margin-bottom:8px;">🛏️ Room ' + htlEscape(room.room_number) + ' <small style="color:#64748b;">(' + htlEscape(room.room_type) + ' · ' + htlMoney(room.base_rate) + '/night)</small></h3>';

    if (room.status === 'available' || room.status === 'cleaning') {
        body += '<p style="font-size:12px;color:#10b981;font-weight:700;margin-bottom:8px;">✅ Ready for guests</p>' +
            '<input class="htl-input" id="ciName" placeholder="Guest name *">' +
            '<input class="htl-input" id="ciPhone" placeholder="Phone">' +
            '<input class="htl-input" id="ciDoc" placeholder="Passport / ID number">' +
            '<input class="htl-input" id="ciNationality" placeholder="Nationality">' +
            '<div style="display:flex;gap:6px;">' +
            '<input type="number" class="htl-input" id="ciNights" placeholder="Nights *" style="flex:1;">' +
            '<input type="number" class="htl-input" id="ciRate" value="' + room.base_rate + '" placeholder="Rate/night" style="flex:1;">' +
            '</div>' +
            '<div style="display:flex;gap:6px;">' +
            '<input type="number" class="htl-input" id="ciGuests" placeholder="Guests" value="1" style="flex:1;">' +
            '<input type="number" class="htl-input" id="ciDeposit" placeholder="Deposit (optional)" style="flex:1;">' +
            '</div>' +
            '<button class="htl-btn success" onclick="htlCheckIn(\'' + roomId + '\')">🚪 Check In</button>';
    } else if (room.status === 'occupied' && stay) {
        body += '<div style="background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px;">' +
            '👤 <b>' + htlEscape(stay.guest_name) + '</b><br>' +
            '📞 ' + htlEscape(stay.guest_phone || '—') + ' · 🌍 ' + htlEscape(stay.guest_nationality || '—') + '<br>' +
            '🚪 In: ' + new Date(stay.check_in).toLocaleDateString() + ' → Out: ' + (stay.planned_checkout ? new Date(stay.planned_checkout).toLocaleDateString() : 'open') + '<br>' +
            '💰 ' + htlMoney(stay.nightly_rate) + '/night · Deposit: ' + htlMoney(stay.deposit || 0) + '</div>' +
            '<button class="htl-btn primary" onclick="htlOpenFolio(\'' + stay.id + '\')">📋 View Folio & Checkout</button>' +
            '<button class="htl-btn outline" onclick="htlQuickCharge(\'' + stay.id + '\')">➕ Add Charge (minibar/laundry)</button>' +
            '<button class="htl-btn outline" onclick="htlExtendStay(\'' + stay.id + '\')">🌙 Extend Stay</button>';
    } else if (room.status === 'reserved') {
        body += '<p style="color:#3b82f6;">📅 Reserved</p>' +
            '<button class="htl-btn success" onclick="htlSetRoomStatus(\'' + roomId + '\',\'available\')">🚪 Guest Arrived — Check In</button>' +
            '<button class="htl-btn outline" onclick="htlSetRoomStatus(\'' + roomId + '\',\'available\')">❌ Cancel Reservation</button>';
    } else if (room.status === 'maintenance') {
        body += '<p style="color:#64748b;">🔧 Under maintenance</p>' +
            '<button class="htl-btn success" onclick="htlSetRoomStatus(\'' + roomId + '\',\'cleaning\')">✅ Fixed → Cleaning</button>';
    }
    body += '<button class="htl-btn outline" onclick="htlCloseModal(\'roomActionsModal\')">Close</button>';
    htlModal('roomActionsModal', body);
}

async function htlCheckIn(roomId) {
    var room = HTL.rooms.find(function(r){ return r.id === roomId; });
    var name = document.getElementById('ciName').value.trim();
    var nights = parseInt(document.getElementById('ciNights').value) || 0;
    var rate = parseFloat(document.getElementById('ciRate').value) || room.base_rate;
    if (!name || nights <= 0) { alert('Guest name and nights are required.'); return; }
    var checkout = new Date(Date.now() + nights * 86400000).toISOString().slice(0,10);
    try {
        const { data: stay, error } = await htlSb.from('guest_stays').insert([{
            shop_id: htlShopId(), room_id: roomId, guest_name: name,
            guest_phone: document.getElementById('ciPhone').value.trim(),
            guest_id_doc: document.getElementById('ciDoc').value.trim(),
            guest_nationality: document.getElementById('ciNationality').value.trim(),
            guests_count: parseInt(document.getElementById('ciGuests').value) || 1,
            check_in: new Date().toISOString(), planned_checkout: checkout,
            nightly_rate: rate, deposit: parseFloat(document.getElementById('ciDeposit').value) || 0,
            status: 'active'
        }]).select().single();
        if (error) throw error;
        await htlSb.from('rooms').update({ status: 'occupied' }).eq('id', roomId);
        await htlSb.from('folio_charges').insert([{ shop_id: htlShopId(), stay_id: stay.id,
            charge_type: 'room_night', description: 'Room ' + room.room_number + ' — night 1', amount: rate }]);
        htlCloseModal('roomActionsModal');
        await htlLoad(); htlRenderReception();
        alert('✅ ' + name + ' checked in to Room ' + room.room_number + '!\n\nCheckout: ' + new Date(checkout).toLocaleDateString() + '\nRate: ' + htlMoney(rate) + '/night');
    } catch(e) { alert('❌ ' + e.message); }
}

async function htlOpenFolio(stayId) {
    const { data: stay } = await htlSb.from('guest_stays').select('*').eq('id', stayId).single();
    if (!stay) return;

    // 🔑 AUTO-BILL missing nights (never undercharge!)
    const { data: charges } = await htlSb.from('folio_charges').select('*').eq('stay_id', stayId).order('charge_date');
    var nightsStayed = Math.max(1, Math.ceil((Date.now() - new Date(stay.check_in)) / 86400000));
    var roomNights = (charges || []).filter(function(c){ return c.charge_type === 'room_night'; }).length;
    if (nightsStayed > roomNights) {
        for (var n = roomNights + 1; n <= nightsStayed; n++) {
            await htlSb.from('folio_charges').insert([{ shop_id: htlShopId(), stay_id: stayId,
                charge_type: 'room_night', description: 'Room — night ' + n, amount: stay.nightly_rate }]);
        }
    }
    const { data: list } = await htlSb.from('folio_charges').select('*').eq('stay_id', stayId).order('charge_date');

    var icons = { room_night:'🛏️', food:'🍽️', minibar:'🥤', laundry:'👕', spa:'💆', other:'➕' };
    var total = 0, rows = '';
    (list || []).forEach(function(c) {
        total += Number(c.amount);
        rows += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">' +
            '<span>' + (icons[c.charge_type] || '➕') + ' ' + htlEscape(c.description || c.charge_type) + '</span><b>' + htlMoney(c.amount) + '</b></div>';
    });
    var due = total - (stay.deposit || 0);

    htlCloseModal('roomActionsModal');
    htlModal('folioModal',
        '<h3>📋 Folio — ' + htlEscape(stay.guest_name) + '</h3>' +
        '<div style="max-height:38vh;overflow-y:auto;">' + (rows || '<p style="color:#94a3b8;">No charges.</p>') + '</div>' +
        '<div style="border-top:2px solid #e2e8f0;margin-top:10px;padding-top:10px;">' +
        '<div style="display:flex;justify-content:space-between;"><span>Total</span><b>' + htlMoney(total) + '</b></div>' +
        '<div style="display:flex;justify-content:space-between;color:#10b981;"><span>Deposit</span><b>−' + htlMoney(stay.deposit || 0) + '</b></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:18px;color:#ef4444;"><span><b>BALANCE DUE</b></span><b>' + htlMoney(due) + '</b></div></div>' +
        '<button class="htl-btn success" onclick="htlPayModal(\'' + stayId + '\',' + due + ')">💳 Pay ' + htlMoney(due) + ' & Check Out</button>' +
        '<button class="htl-btn outline" onclick="htlCloseModal(\'folioModal\')">Close</button>');
}

function htlPayModal(stayId, due) {
    htlCloseModal('folioModal');
    htlModal('payModal',
        '<h3>💳 Collect Payment — ' + htlMoney(due) + '</h3>' +
        '<button class="htl-btn success" onclick="htlCheckout(\'' + stayId + '\',' + due + ',\'cash\')">💵 Cash</button>' +
        '<button class="htl-btn primary" onclick="htlCheckout(\'' + stayId + '\',' + due + ',\'card\')">💳 Card</button>' +
        '<button class="htl-btn primary" onclick="htlCheckout(\'' + stayId + '\',' + due + ',\'mobile\')">📱 Mobile (Telebirr/CBE)</button>' +
        '<button class="htl-btn outline" onclick="htlCloseModal(\'payModal\')">Cancel</button>');
}

async function htlCheckout(stayId, due, method) {
    if (!await confirm('Collect ' + htlMoney(due) + ' (' + method + ') and check out?')) return;
    try {
        await htlSb.from('sales').insert([{
            items: [{ name: 'Hotel room settlement', qty: 1, price: Number(due), subtotal: Number(due) }],
            subtotal: Number(due), discount: 0, tax: 0, total: Number(due), profit: 0,
            payment_method: method, payments: [{ method: method, amount: Number(due) }],
            shop_id: htlShopId(),
            cashier_id: localStorage.getItem('hotelStaffId') || 'reception',
            cashier_name: localStorage.getItem('hotelStaffName') || 'Reception',
            shift_id: 'hotel', time: new Date().toISOString(),
            note: 'Hotel checkout', invoice_no: 'HTL-' + Date.now().toString().slice(-8),
            order_type: 'Room Stay'
        }]);
        const { data: stay } = await htlSb.from('guest_stays').select('room_id, guest_name').eq('id', stayId).single();
        var room = HTL.rooms.find(function(r){ return r.id === stay.room_id; });
        await htlSb.from('guest_stays').update({ status: 'checked_out', actual_checkout: new Date().toISOString() }).eq('id', stayId);
        await htlSb.from('rooms').update({ status: 'cleaning' }).eq('id', stay.room_id);
        await htlSb.from('hotel_alerts').insert([{
            shop_id: htlShopId(), alert_type: 'checkout',
            room_number: room ? room.room_number : '?', guest_name: stay.guest_name,
            message: 'Guest checked out — verify room property at gate'
        }]);
        htlCloseModal('payModal');
        await htlLoad(); htlRenderReception();
        alert('✅ Checked out! Payment recorded.\nRoom → 🧹 Cleaning · Guard notified 🔔');
    } catch(e) { alert('❌ ' + e.message); }
}

async function htlQuickCharge(stayId) {
    var amt = parseFloat(await prompt('Charge amount:'));
    if (isNaN(amt) || amt <= 0) return;
    var desc = await prompt('Description (e.g., Minibar — 2 beers):', 'Extra charge');
    if (!desc) return;
    await htlSb.from('folio_charges').insert([{ shop_id: htlShopId(), stay_id: stayId,
        charge_type: 'other', description: desc, amount: amt }]);
    htlCloseModal('roomActionsModal');
    htlOpenFolio(stayId);
}

async function htlExtendStay(stayId) {
    var extra = parseInt(await prompt('Extend by how many nights?', '1'));
    if (isNaN(extra) || extra <= 0) return;
    const { data: stay } = await htlSb.from('guest_stays').select('planned_checkout').eq('id', stayId).single();
    var nd = new Date(new Date(stay.planned_checkout).getTime() + extra * 86400000).toISOString().slice(0,10);
    await htlSb.from('guest_stays').update({ planned_checkout: nd }).eq('id', stayId);
    htlCloseModal('roomActionsModal');
    alert('✅ New checkout: ' + new Date(nd).toLocaleDateString());
    await htlLoad(); htlRenderReception();
}

async function htlSetRoomStatus(roomId, status) {
    await htlSb.from('rooms').update({ status: status }).eq('id', roomId);
    htlCloseModal('roomActionsModal');
    await htlLoad(); htlRenderReception();
}

// ═══ CLEANER ═══
async function htlRenderCleaner() {
    var html = '<h2>🧹 My Cleaning Tasks</h2><p style="color:#94a3b8;font-size:13px;">Rooms waiting for you:</p><div style="margin-top:12px;">';
    var tasks = HTL.rooms.filter(function(r){ return r.status === 'cleaning'; });
    if (tasks.length === 0) {
        html += '<p style="color:#10b981;font-weight:bold;padding:20px;text-align:center;">✨ All rooms clean — great job!</p>';
    } else {
        tasks.forEach(function(room) {
            html += '<div style="background:#92400e;border-radius:14px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">' +
                '<div><b style="font-size:20px;">🛏️ ' + htlEscape(room.room_number) + '</b><br><small style="opacity:.8;">' + htlEscape(room.room_type) + '</small></div>' +
                '<button onclick="htlCleaned(\'' + room.id + '\')" style="background:#10b981;color:#fff;border:none;padding:14px 22px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;">✅ Cleaned</button></div>';
        });
    }
    document.getElementById('htlContent').innerHTML = html + '</div>';
}

async function htlCleaned(roomId) {
    await htlSb.from('rooms').update({ status: 'available' }).eq('id', roomId);
    if (navigator.vibrate) navigator.vibrate(100);
    await htlLoad(); htlRenderCleaner();
}

// ═══ GUARD ═══
async function htlRenderGuard() {
    const { data } = await htlSb.from('hotel_alerts').select('*')
        .eq('shop_id', htlShopId()).eq('status', 'pending').order('created_at', { ascending: false });
    var html = '<h2>💂 Security Alerts</h2><p style="color:#94a3b8;font-size:13px;">Watch for guests leaving:</p><div style="margin-top:12px;">';
    if (!data || data.length === 0) {
        html += '<p style="color:#10b981;padding:20px;text-align:center;">✅ No active alerts. All calm.</p>';
    } else {
        data.forEach(function(a) {
            html += '<div style="background:#7f1d1d;border-radius:14px;padding:16px;margin-bottom:10px;">' +
                '<b style="font-size:16px;">🔔 ' + htlEscape(a.message) + '</b><br>' +
                '<span style="font-size:13px;">🛏️ Room ' + htlEscape(a.room_number || '?') + ' · 👤 ' + htlEscape(a.guest_name || '') + '</span><br>' +
                '<small style="opacity:.7;">' + new Date(a.created_at).toLocaleTimeString() + '</small><br>' +
                '<button onclick="htlAckAlert(\'' + a.id + '\')" style="background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer;">✓ Acknowledged</button></div>';
        });
    }
    document.getElementById('htlContent').innerHTML = html + '</div>';
}

async function htlAckAlert(id) {
    await htlSb.from('hotel_alerts').update({ status: 'acknowledged' }).eq('id', id);
    htlRenderGuard();
}

// ═══ REALTIME (live updates + guard alarm) ═══
function htlRealtime() {
    window.__htlChannel = htlSb.channel('hotel-' + htlShopId())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: 'shop_id=eq.' + htlShopId() }, function() {
            htlLoad().then(function(){ htlRenderMyMode(); });
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'hotel_alerts', filter: 'shop_id=eq.' + htlShopId() }, function() {
            if (htlRole() === 'Guard') {
                try { navigator.vibrate([300,150,300]); } catch(e) {}
                try { htlBeep(); } catch(e) {}
                htlRenderGuard();
            }
        })
        .subscribe();
}

function htlBeep() {
    try {
        var ctx = window.__htlAudio || new (window.AudioContext || window.webkitAudioContext)();
        window.__htlAudio = ctx;
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; g.gain.value = 0.3;
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}
