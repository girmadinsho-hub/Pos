<!DOCTYPE html>
<html>
<head>
    <title>SmartShop Pro — Icon Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background: #0f172a; color: white; }
        canvas { margin: 20px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        button { padding: 15px 30px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 16px; margin: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🏪 SmartShop Pro</h1>
    <p>Tap to download your app icons</p>
    <canvas id="iconCanvas" width="512" height="512"></canvas>
    <br>
    <button onclick="downloadIcon(192)">📥 Save 192×192</button>
    <button onclick="downloadIcon(512)">📥 Save 512×512</button>
    <script>
    function drawIcon(size) {
        var canvas = document.getElementById('iconCanvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var s = size;
        var grad = ctx.createLinearGradient(0, 0, s, s);
        grad.addColorStop(0, '#1e3a8a');
        grad.addColorStop(1, '#3b82f6');
        ctx.fillStyle = grad;
        var r = s * 0.22;
        ctx.beginPath();
        ctx.moveTo(r, 0); ctx.lineTo(s-r, 0);
        ctx.quadraticCurveTo(s, 0, s, r); ctx.lineTo(s, s-r);
        ctx.quadraticCurveTo(s, s, s-r, s); ctx.lineTo(r, s);
        ctx.quadraticCurveTo(0, s, 0, s-r); ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = s * 0.035;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(s*0.30, s*0.38); ctx.lineTo(s*0.70, s*0.38);
        ctx.lineTo(s*0.65, s*0.76); ctx.lineTo(s*0.35, s*0.76);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.arc(s*0.5, s*0.38, s*0.13, Math.PI, 0);
        ctx.stroke();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = s * 0.05;
        ctx.beginPath();
        ctx.moveTo(s*0.41, s*0.57); ctx.lineTo(s*0.48, s*0.65); ctx.lineTo(s*0.62, s*0.49);
        ctx.stroke();
    }
    function downloadIcon(size) {
        drawIcon(size);
        var canvas = document.getElementById('iconCanvas');
        try {
            canvas.toBlob(function(blob) {
                var link = document.createElement('a');
                link.download = 'icon-' + size + '.png';
                link.href = URL.createObjectURL(blob);
                link.click();
            }, 'image/png');
        } catch(e) {
            var link = document.createElement('a');
            link.download = 'icon-' + size + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    }
    drawIcon(512);
    </script>
</body>
</html>
